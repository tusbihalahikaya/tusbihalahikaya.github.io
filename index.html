<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أبو غليون — يوتيوب</title>
<meta name="description" content="القصة كاملة على قناة «أبو غليون» في يوتيوب.">
<meta property="og:title" content="أبو غليون — القصة كاملة على يوتيوب">
<meta property="og:description" content="حكايات حقيقية من تاريخنا. حكاية جديدة كل يوم.">
<style>
  :root { --night:#4A0D22; --amber:#F7B92B; --ink:#FCEFD2; --soft:#E9C3CB; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--night); color:var(--ink); font-family:-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; text-align:center; }
  main { width:100%; max-width:420px; }
  .mark { width:112px; height:112px; margin:0 auto 16px; border-radius:50%; display:block; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  h1 { font-size:34px; font-weight:900; margin:0 0 8px; }
  p { font-size:17px; line-height:1.7; margin:0 0 22px; color:var(--soft); }
  a.btn { display:block; background:var(--amber); color:#26050F; text-decoration:none; font-weight:800; font-size:21px;
          padding:18px 16px; border-radius:16px; }
  a.btn:active { transform:scale(.98); }
  .help { margin-top:22px; font-size:15px; line-height:1.8; color:var(--soft); display:none; }
  .help a { color:var(--amber); }
  .help b { color:var(--ink); }
</style>
</head>
<body>
<main>
  <img class="mark" src="abu.jpg" alt="" width="112" height="112">
  <h1>أبو غليون</h1>
  <p id="line">القصة كاملة على قناتنا في يوتيوب… حكاية جديدة كل يوم.</p>
  <a class="btn" id="open" href="https://www.youtube.com/channel/UCSY3vvxaxk9DjNPgZ3y5EDw?sub_confirmation=1">افتح في تطبيق يوتيوب</a>
  <div class="help" id="help">
    ما فتح التطبيق؟ اضغط الزر مرة ثانية.<br>
    وإذا ما زبط: اضغط <b>⋯</b> فوق، واختر <b>«فتح في المتصفح»</b>.<br>
    أو <a id="web" href="https://www.youtube.com/channel/UCSY3vvxaxk9DjNPgZ3y5EDw?sub_confirmation=1">افتح صفحة القناة من هنا</a>.
  </div>
</main>
<script>
(function () {
  // The one address for both bios. It opens the channel, or one video when the address ends with ?v=<video id>.
  var CHANNEL_ID = "UCSY3vvxaxk9DjNPgZ3y5EDw";   // the channel id never changes, whatever the channel is called
  var v = new URLSearchParams(location.search).get("v");
  if (!/^[A-Za-z0-9_-]{6,15}$/.test(v || "")) v = null;

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  var web = v ? "https://www.youtube.com/watch?v=" + v
              : "https://www.youtube.com/channel/" + CHANNEL_ID + "?sub_confirmation=1";
  var path = v ? "www.youtube.com/watch?v=" + v : "www.youtube.com/channel/" + CHANNEL_ID;
  // iPhone: the YouTube app's own address scheme. Android: an intent that names the YouTube app and falls back to the web page.
  var app = isAndroid
    ? "intent://" + path + "#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=" + encodeURIComponent(web) + ";end"
    : (isIOS ? "youtube://" + path : web);

  var btn = document.getElementById("open"), help = document.getElementById("help");
  document.getElementById("web").href = web;
  btn.href = app;
  if (v) document.getElementById("line").textContent = "القصة كاملة على قناتنا في يوتيوب… اضغط وكمّلها.";

  function showHelp() { if (!document.hidden) help.style.display = "block"; }
  btn.addEventListener("click", function () { setTimeout(showHelp, 1800); });

  // Try once by itself. Some in-app browsers block this, which is why the button is there.
  if (isAndroid || isIOS) {
    setTimeout(function () { location.href = app; }, 350);
    setTimeout(showHelp, 2200);
  } else {
    location.replace(web);
  }
})();
</script>
</body>
</html>
